server {
  listen 80;
  server_name localhost;

  # Explicit MIME types so crawlers get correct Content-Type
  types {
    text/html                  html htm;
    text/css                   css;
    application/javascript     js;
    application/json           json;
    image/svg+xml              svg svgz;
    image/x-icon               ico;
    image/png                  png;
    image/jpeg                 jpeg jpg;
    image/webp                 webp;
    application/xml            xml;
    text/plain                 txt;
    font/woff2                 woff2;
    font/woff                  woff;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    # Serve real files first; only fall back to SPA index for unknown paths
    try_files $uri $uri/ /index.html;
  }

  # Static files: serve directly, never fall through to SPA
  location ~* \.(xml|txt|ico|png|jpg|jpeg|webp|svg|woff2|woff|css|js)$ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }
}